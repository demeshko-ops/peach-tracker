# Тимчасова схема деплою: кожен пуш у main дзеркалиться в гілку gh-pages,
# звідки GitHub Pages публікує сайт (джерело "Deploy from a branch").
# Стандартний GITHUB_TOKEN не має прав перемкнути джерело Pages на
# "GitHub Actions", тому після ручного перемикання в Settings → Pages цю
# схему можна замінити на configure-pages / upload-pages-artifact / deploy-pages.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
